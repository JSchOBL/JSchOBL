name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Renders the contribution grid being eaten by a snake, in the palette
      # from johannes-schieder.com. Output lands on the `output` branch, which
      # the README links to directly — nothing is committed to main.
      - name: Render the snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#0a192f&color_dots=#ebedf0,#a8b2d8,#8892b0,#233554,#0a192f
            dist/snake-dark.svg?palette=github-dark&color_snake=#64ffda&color_dots=#0a192f,#112240,#233554,#8892b0,#64ffda

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
