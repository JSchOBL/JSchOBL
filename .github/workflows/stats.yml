name: Refresh stat cards

on:
  schedule:
    # 04:17 UTC daily — off the hour, since everyone's cron fires at :00
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/generate_stats.py"
      - ".github/workflows/stats.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render assets/stats.svg and assets/langs.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_stats.py

      - name: Commit only if the numbers actually moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg
          # -I ignores the "updated <date>" line, so an unchanged profile
          # doesn't produce a commit every single morning.
          if git diff --staged --quiet -I 'updated [0-9]'; then
            echo "Stats unchanged — nothing to commit."
          else
            git commit -m "chore: refresh stat cards"
            git push
          fi
