<svg xmlns="http://www.w3.org/2000/svg" width="900" height="208"
     viewBox="0 0 900 208" role="img"
     aria-label="GitHub statistics for Johannes Schieder">
  <title>GitHub statistics for Johannes Schieder</title>
  <style>
    .card { fill: #0a192f; stroke: #233554; }
    .mono { font-family: ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
    .sans { font-family: Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .prompt { font-size: 13px; fill: #64ffda; }
    .caret { fill: #64ffda; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); }
                       to { opacity: 1; transform: translateY(0); } }
    .rise { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
    @media (prefers-reduced-motion: reduce) {
      .rise, .caret, .grow { animation: none; opacity: 1; }
    }
</style>
  <rect class="card" x=".5" y=".5" width="899" height="207" rx="10"/>
  <text class="mono prompt" x="28" y="40">$ gh stats --user JSchOBL</text>
  <rect class="caret" x="233" y="29" width="8" height="14" rx="1"/>
  <text class="mono" x="28" y="64" font-size="12" fill="#8892b0">
    all-time activity across public repositories</text>
  <text class="mono" x="872" y="64" font-size="10.5" text-anchor="end"
        fill="#8892b0" opacity=".5">updated 28 Jul 2026</text>
  <g class="rise" style="animation-delay:0.15s">
    <rect x="28.0" y="88" width="129.0" height="92" rx="6"
          fill="#112240" stroke="#233554"/>
