<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300"
     role="img" aria-label="Johannes Schieder — I build things.">
  <title>Johannes Schieder — I build things.</title>

  <defs>
    <!-- the drifting cursor glow from johannes-schieder.com -->
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity=".38"/>
      <stop offset="70%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0%" stop-color="#64ffda"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#233554" stroke-width="1" opacity=".35"/>
    </pattern>
    <clipPath id="card">
      <rect x="1" y="1" width="998" height="298" rx="12"/>
    </clipPath>
    <clipPath id="typed">
      <!-- base width = fully typed, so the line still reads without animation -->
      <rect id="reveal" x="52" y="222" width="372" height="22"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
    .sans { font-family: Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }

    @keyframes type   { from { width: 0; }               to { width: 372px; } }
    @keyframes travel { from { transform: translateX(0); } to { transform: translateX(372px); } }
    @keyframes blink  { 50% { opacity: 0; } }
    @keyframes rise   { from { opacity: 0; transform: translateY(12px); }
                        to   { opacity: 1; transform: translateY(0); } }
    @keyframes draw   { from { width: 0; } to { width: 300px; } }

    #reveal   { animation: type 2.4s steps(46,end) .5s both; }
    #caret    { animation: travel 2.4s steps(46,end) .5s both, blink 1.1s steps(1) infinite; }
    #underline{ animation: draw 1s cubic-bezier(.2,.8,.2,1) .35s both; }
    .rise     { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
    .d1 { animation-delay: .05s } .d2 { animation-delay: .15s } .d3 { animation-delay: .25s }
    .d4 { animation-delay: .45s } .d5 { animation-delay: .55s } .d6 { animation-delay: .65s }
    .d7 { animation-delay: .75s } .d8 { animation-delay: .85s } .d9 { animation-delay: .95s }

    @media (prefers-reduced-motion: reduce) {
      #reveal, #caret, #underline, .rise { animation: none; opacity: 1; }
    }
  </style>

  <rect x=".5" y=".5" width="999" height="299" rx="12" fill="#0a192f" stroke="#233554"/>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#grid)"/>
    <circle r="420" fill="url(#glow)">
      <animate attributeName="cx" values="240;720;400;240" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="110;220;60;110" dur="23s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ── left: the intro from the site ───────────────────────────────── -->
  <text class="mono rise d1" x="52" y="86" font-size="14" fill="#64ffda">Hi, my name is</text>

  <text class="sans rise d2" x="52" y="146" font-size="48" font-weight="700"
        letter-spacing="-1" fill="#ccd6f6">Johannes Schieder.</text>
  <rect id="underline" x="52" y="158" width="300" height="2" rx="1" fill="url(#rule)"/>

  <text class="sans rise d3" x="52" y="196" font-size="30" font-weight="600"
        fill="#a8b2d8">I build things.</text>

  <g clip-path="url(#typed)">
    <text class="mono" x="52" y="238" font-size="13.5" fill="#8892b0"
      >backend engineer · cloud infrastructure · data</text>
  </g>
  <rect id="caret" x="52" y="226" width="8" height="14" rx="1" fill="#64ffda"/>

  <!-- ── right: johannes.ts ──────────────────────────────────────────── -->
  <g class="rise d4">
    <rect x="560" y="52" width="392" height="196" rx="8" fill="#112240" stroke="#233554"/>
    <path d="M560 84h392" stroke="#233554" stroke-width="1"/>
    <circle cx="582" cy="68" r="4.5" fill="#ff5f57" opacity=".85"/>
    <circle cx="598" cy="68" r="4.5" fill="#febc2e" opacity=".85"/>
    <circle cx="614" cy="68" r="4.5" fill="#28c840" opacity=".85"/>
    <text class="mono" x="636" y="72" font-size="11" fill="#8892b0">johannes.ts</text>
  </g>

  <!-- Indent and value alignment come from explicit x offsets, not from source
       whitespace: SVG collapses leading spaces in text content. -->
  <g class="mono" font-size="11.5">
    <text class="rise d5" x="582" y="112" fill="#8892b0"
      ><tspan fill="#64ffda">const</tspan> <tspan fill="#ccd6f6">johannes</tspan> = {</text>
    <text class="rise d6" x="600" y="134" fill="#8892b0"
      >role:<tspan x="648" fill="#64ffda">"Dual Student, Industry 4.0"</tspan>,</text>
    <text class="rise d7" x="600" y="156" fill="#8892b0"
      >at:<tspan x="648" fill="#64ffda">"BHS Corrugated"</tspan>,</text>
    <text class="rise d8" x="600" y="178" fill="#8892b0"
      >focus:<tspan x="648">[</tspan><tspan fill="#64ffda">"backend"</tspan>, <tspan fill="#64ffda">"cloud"</tspan>, <tspan fill="#64ffda">"data"</tspan>],</text>
    <text class="rise d9" x="600" y="200" fill="#8892b0"
      >site:<tspan x="648" fill="#64ffda">"johannes-schieder.com"</tspan>,</text>
    <text class="rise d9" x="582" y="222" fill="#8892b0">};</text>
  </g>
</svg>
