<svg xmlns="http://www.w3.org/2000/svg" width="900" height="238"
     viewBox="0 0 900 238" role="img"
     aria-label="Most used languages by Johannes Schieder">
  <title>Most used languages by Johannes Schieder</title>
  <style>
    .card { fill: #0a192f; stroke: #233554; }
    .mono { font-family: ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
    .sans { font-family: Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .prompt { font-size: 13px; fill: #64ffda; }
    .caret { fill: #64ffda; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); }
                       to { opacity: 1; transform: translateY(0); } }
    .rise { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
    @media (prefers-reduced-motion: reduce) {
      .rise, .caret, .grow { animation: none; opacity: 1; }
    }
</style>
  <rect class="card" x=".5" y=".5" width="899" height="237" rx="10"/>
  <text class="mono prompt" x="28" y="40">$ gh langs --weighted</text>
  <rect class="caret" x="201" y="29" width="8" height="14" rx="1"/>
  <text class="mono" x="28" y="62" font-size="12" fill="#8892b0">
    share of each repository, so one big repo can't drown out the rest</text>
  <clipPath id="bar"><rect x="28" y="78" width="844" height="12" rx="6"/></clipPath>
